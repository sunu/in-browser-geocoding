# Gold suite source. gold/build_gold.py converts this file to gold/gold.jsonl.
#
# Fields: q (query), t (template), s (slots), n (notes, optional).
# Slot values:
#   closed slots: the option key, for example "coastal", "state", "amenity:hospital", "gt"
#   distance: meters, or null for the default distance
#   value: a number
#   region or anchor: the exact text of the slot in the query, or
#     {lex: <lexicon key>, text: <text>} for a lexicon set, or
#     {q: <text>, t: <template>, s: {...}} for a sub-query
# src: the expected source for each anchor on the simple path (overture or photon)

# ---------------------------------------------------------------- lookup
