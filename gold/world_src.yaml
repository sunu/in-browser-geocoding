# World gold set (plan-008 phase 7). Written on 2026-11-17. Use it only to report; do not tune on it.
# Same record format as gold_src.yaml, plus `cc` and `ids`. `ids`: slot name to Overture id, for an anchor whose
# top gazetteer candidate is not the gold place. `cc`: the country of the map view. `views` gives the view (bbox) of
# each country. The build and the runs give this view to the gazetteer and to the executor.
views:
  US: [-125, 24, -66, 50]
  GB: [-8.7, 49.8, 1.8, 60.9]
  FR: [-5, 41, 10, 51.5]
  DE: [5.8, 47.2, 15.1, 55.1]
