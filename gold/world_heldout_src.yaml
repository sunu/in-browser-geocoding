# World held-out set (plan-022, phase 8). Written on 2026-11-18, after the phase 8 fixes and before any run on it.
# Do not tune on these records. Use them only to report. Same format as world_src.yaml.
# Removed before the first run: "northern Luzon" (Luzon is an island, not an admin division; the top candidate is a village).
views:
  CA: [-141, 41.7, -52.6, 83.1]
  IT: [6.6, 36.6, 18.5, 47.1]
  ES: [-9.3, 36, 3.3, 43.8]
