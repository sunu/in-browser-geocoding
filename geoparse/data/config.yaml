# geoparse configuration. All policy decisions are in this file. Do not hard-code policy in SQL.

data:
  overture_release: "2026-10-21.0"
  overture_s3: "s3://overturemaps-us-west-2/release"
  # Extent of the extract: "country" (the country below) or "world" (all countries, no places).
  # The environment variable GEOPARSE_SCOPE overrides this value.
  scope: country
  # Build output directories, relative to the repo root.
  build_dir: "data/build"
  world_build_dir: "data/build-world"
  # India bounding box: xmin, ymin, xmax, ymax.
  bbox: [68.0, 6.5, 97.5, 37.2]
  country: "IN"
  # Country polygons outside India that the extract keeps, so that queries such as
  # "countries that border India" work. ISO 3166-1 alpha-2 codes.
  extra_countries: [AF, BD, BT, CN, IR, LK, MM, MV, NP, PK]
  # World point datasets (plan-008 phase 5): file name to category items (categories.json). The world build
  # keeps places with confidence of policy.places_min_confidence or more. Other categories use Photon.
  poi_datasets:
    hospitals: [hospital]
    schools: [school, preschool]
  natural_earth_coastline: "https://naciscdn.org/naturalearth/10m/physical/ne_10m_coastline.zip"
  # Natural features (plan-026): Natural Earth 10m physical files, and the Wikidata endpoint for their English names.
  natural_earth_physical: "https://naciscdn.org/naturalearth/10m/physical/"
  natural_earth_files: [ne_10m_rivers_lake_centerlines, ne_10m_lakes, ne_10m_geography_regions_polys,
                        ne_10m_geography_marine_polys, ne_10m_geographic_lines]
  wikidata_sparql: "https://query.wikidata.org/sparql"
  # Natural features that Natural Earth does not have (plan-030): kind, name, Wikidata id (English names), extra
  # names, and a box (xmin, ymin, xmax, ymax), a point or a line. The lines of latitude and the date line are in
  # ne_10m_geographic_lines. The Arctic: north of the Arctic Circle; "Artic" is a frequent misspelling.
  extra_natural:
    - {kind: area, name: Arctic, wikidata: Q25322, names: [Artic, Arctic region], bbox: [-180, 66.5622, 180, 90]}
    - {kind: area, name: Antarctic, names: [Antarctic region, Antartic], bbox: [-180, -90, 180, -66.5622]}
    - {kind: point, name: North Pole, wikidata: Q934, names: [the North Pole], point: [0, 90]}
    - {kind: point, name: South Pole, wikidata: Q933, names: [the South Pole], point: [0, -90]}
    - {kind: line, name: Prime Meridian, names: [Greenwich meridian, Greenwich Meridian, zero meridian], line: [[0, -90], [0, 90]]}
  # Simplified country shapes (table country_shapes, web file country_shapes.parquet): the countries around a natural
  # feature. Parts smaller than min_part_deg2 are dropped (the largest part of each country stays).
  country_shapes: {simplify_deg: 0.05, min_part_deg2: 0.05}

policy:
  # Values from here to `countries` are the defaults. `countries.<ISO code>` changes them for one country.
  # Admin level names that users say, mapped to Overture division subtypes.
  admin_levels:
    country: [country, dependency]
    state: [region]
    union_territory: [region]
    district: [county]
    city: [locality]
    village: [locality]
    locality: [locality, localadmin, macrohood, neighborhood, microhood]
  # Admin level words of one country, in addition to the keywords in options.yaml. A word here belongs only to
  # its level in that country (for example "municipality" is a county in Mexico, and a city in India).
  level_words: {}
  # Level words from the data (Overture local_type of regions and counties, see local_level_words). A value counts
  # if it has this share of the rows of its country and subtype. The skip words have their own level.
  local_type_min_share: 0.2
  local_type_skip: [country, city, town, village]
  # Locality classes that count as a "city".
  city_classes: [city, town]
  # Locality classes that count as a "village".
  village_classes: [village, hamlet]
  # Regions (ISO 3166-2 codes) that are union territories.
  union_territories: []
  # If true, union territories count as states in "states" queries.
  union_territories_are_states: true
  # Regions with no ISO code (disputed areas from other perspectives) are not used.
  require_region_code: true
  # Values for one country. Keys: admin_levels, city_classes, village_classes, union_territories,
  # union_territories_are_states, require_region_code.
  countries:
    IN:
      # Overture marks union territories as "state", so this list is the source of truth.
      union_territories: [IN-AN, IN-CH, IN-DH, IN-DL, IN-JK, IN-LA, IN-LD, IN-PY]
    # The English words for these divisions are not their Overture local_type (SE, PT: "region"; UA: oblasts
    # "province", raions "region").
    SE: {level_words: {state: [county, counties, län]}}
    PT: {level_words: {state: [district, districts]}}
    UA: {level_words: {state: [oblast, oblasts, region, regions], district: [raion, raions]}}
  # A natural feature is around a country if it is this near (degrees) to the simplified country shape.
  around_tolerance_deg: 0.05
  # Country level: Overture's disputed areas (subtype country, codes XA to XZ) are not countries, except these codes
  # (Kosovo; the Gaza Strip and the West Bank, Palestine). Dependencies with X codes (Saba, Jan Mayen) stay.
  disputed_kept: [XK, XG, XW]
  # Distance in meters to the Natural Earth coastline for an area to count as coastal.
  # Natural Earth 10m is about 1 km from the OSM-based Overture boundaries.
  coastal_tolerance_m: 3000
  # Distance in meters for two areas to count as neighbors (touching boundaries).
  neighbor_tolerance_m: 200
  # Default buffer distance when the query gives no distance ("near X").
  default_near_m: 2000
  # Default strip width for "coastal belt of X" or "border belt of X".
  default_strip_m: 5000
  # "northern X": the part of X in the north fraction of its bounding box.
  direction_part_fraction: 0.5
  # "north of X": a box next to X. Its depth is this multiple of the size of X.
  direction_outside_scale: 1.0
  # Minimum Overture places confidence for Features.
  places_min_confidence: 0.5
  # Radius (meters) that stands for the area of a place that has only a point in the extract.
  # Used when an operator needs an area, for example "hospitals in Koramangala".
  point_area_radius_m:
    default: 1000
    microhood: 500
    neighborhood: 800
    macrohood: 1500
    locality: 2000
  # Maximum number of features in one result.
  max_features: 10000
  # Simplification tolerance (degrees) for output geometries. 0 means no simplification.
  output_simplify_deg: 0.0005
  # Ranking of gazetteer candidates (plan-012 section 3.2). A query with no map view uses data.bbox as the
  # view and data.country as the country of the view.
  ranking:
    # Penalties, not boosts: select_source compares the absolute top score with a threshold, so a candidate in
    # the view and in its country keeps its score.
    # Score removed from a candidate whose point is outside the map view.
    view_outside: 0.15
    # Score removed from a candidate that is not in the country of the view center.
    view_other_country: 0.05
    # If the two best candidates are closer than this, ask Photon (boost), then the disambiguate decision.
    close_margin: 0.15
    # The disambiguate decision sees the candidates within this score of the best (after the Photon boost). The browser
    # loads only the countries that can give such a candidate.
    candidate_window: 0.3
    # Score added to the candidates that match Photon results 1, 2, 3.
    photon_boost: [0.2, 0.1, 0.05]
    # Photon results to request for the boost.
    photon_limit: 5

geocoder:
  # Which anchors can go to the geocoder (select_source decides): "simple_and_features" (lookup, modifier,
  # and features families at depth 0) or "all" (every anchor, also landmarks in complex queries).
  anchor_scope: all
  # Source for the Features operator: "places" (local Overture places extract) or "photon".
  features_source: places
  photon_url: "https://photon.komoot.io/api"
  min_interval_s: 1.0
  cache_dir: ".cache/photon"
  # Max results for one Photon request.
  limit: 50
  # Max tiles for one Features request. Large areas are split into tiles.
  max_tiles: 16

t5:
  # T5 candidate generator (plan-005). If the model directory does not exist, the parser uses the patterns only.
  enabled: true
  model_dir: "models/t5/current"
  beams: 4
  # Keep frame groups whose log probability is within this margin of the best frame.
  margin: 2.0
  # Literal split patterns: "always", "fallback" (only if T5 gives no usable frame), or "never".
  use_patterns: fallback
  # If the best frame is "unsupported" with at least this probability, the parser returns Unsupported.
  unsupported_p: 0.5

decisions:
  # Provider for each decision: jev (TypeSafe Jev), local (local cross-encoder), or rules (code and data).
  # A key can be a decision name or a decision with its slot type, for example
  # "fill_closed_slot.category" or "fill_closed_slot.category.group". The most specific key wins.
  # Defaults from the plan-006 evaluation (reports/local-model-report.md).
  providers:
    pick_family: local
    pick_template: local
    pick_split: local
    fill_closed_slot: local
    is_subquery: local
    bind_anchor: rules
    select_source: rules
    disambiguate: rules
  # Local cross-encoder (plan-006).
  local:
    model_dir: "models/local/current"
    device: cpu
  # Minimum confidence for each decision. Below this value the parser returns Unsupported.
  thresholds:
    pick_family: 0.3
    pick_template: 0.3
    fill_closed_slot: 0.3
    bind_anchor: 0.3
    pick_split: 0.2
    is_subquery: 0.2
    select_source: 0.2
    disambiguate: 0.2
  jev:
    url: "https://openrouter.ai/api/alpha/decisions"
    model: "typesafe/jev-1.13"
    timeout_s: 30
  log_dir: "logs"
  max_depth: 2

# The browser page (plan-032). A query that takes longer than query_timeout_s ends with a message; its work in
# DuckDB and ONNX Runtime cannot be stopped, and the page does not show its result.
web:
  query_timeout_s: 90
