# geoparse configuration. All policy decisions are in this file. Do not hard-code policy in SQL.

data:
  overture_release: "2026-10-21.0"
  overture_s3: "s3://overturemaps-us-west-2/release"
  # Extent of the extract: "country" (the country below) or "world" (all countries, no places).
  # The environment variable GEOPARSE_SCOPE overrides this value.
  scope: country
  # Build output directories, relative to the repo root.
  build_dir: "data/build"
  world_build_dir: "data/build-world"
  # India bounding box: xmin, ymin, xmax, ymax.
  bbox: [68.0, 6.5, 97.5, 37.2]
  country: "IN"
  # Country polygons outside India that the extract keeps, so that queries such as
  # "countries that border India" work. ISO 3166-1 alpha-2 codes.
  extra_countries: [AF, BD, BT, CN, IR, LK, MM, MV, NP, PK]
  natural_earth_coastline: "https://naciscdn.org/naturalearth/10m/physical/ne_10m_coastline.zip"

policy:
  # Admin level names that users say, mapped to Overture division subtypes.
  admin_levels:
    country: [country]
    state: [region]
    union_territory: [region]
    district: [county]
    city: [locality]
    village: [locality]
    locality: [locality, macrohood, neighborhood, microhood]
  # Locality classes that count as a "city".
  city_classes: [city, town]
  # Locality classes that count as a "village".
  village_classes: [village, hamlet]
  # Union territories. Overture marks them as "state", so this list is the source of truth.
  union_territories: [IN-AN, IN-CH, IN-DH, IN-DL, IN-JK, IN-LA, IN-LD, IN-PY]
  # If true, union territories count as states in "states" queries.
  union_territories_are_states: true
  # Regions with no ISO code (disputed areas from other perspectives) are not used.
  require_region_code: true
  # Distance in meters to the Natural Earth coastline for an area to count as coastal.
  # Natural Earth 10m is about 1 km from the OSM-based Overture boundaries.
  coastal_tolerance_m: 3000
  # Distance in meters for two areas to count as neighbors (touching boundaries).
  neighbor_tolerance_m: 200
  # Default buffer distance when the query gives no distance ("near X").
  default_near_m: 2000
  # Default strip width for "coastal belt of X" or "border belt of X".
  default_strip_m: 5000
  # "northern X": the part of X in the north fraction of its bounding box.
  direction_part_fraction: 0.5
  # "north of X": a box next to X. Its depth is this multiple of the size of X.
  direction_outside_scale: 1.0
  # Minimum Overture places confidence for Features.
  places_min_confidence: 0.5
  # Radius (meters) that stands for the area of a place that has only a point in the extract.
  # Used when an operator needs an area, for example "hospitals in Koramangala".
  point_area_radius_m:
    default: 1000
    microhood: 500
    neighborhood: 800
    macrohood: 1500
    locality: 2000
  # Maximum number of features in one result.
  max_features: 10000
  # Simplification tolerance (degrees) for output geometries. 0 means no simplification.
  output_simplify_deg: 0.0005

geocoder:
  # Which anchors can go to the geocoder (select_source decides): "simple_and_features" (lookup, modifier,
  # and features families at depth 0) or "all" (every anchor, also landmarks in complex queries).
  anchor_scope: all
  # Source for the Features operator: "places" (local Overture places extract) or "photon".
  features_source: places
  photon_url: "https://photon.komoot.io/api"
  min_interval_s: 1.0
  cache_dir: ".cache/photon"
  # Max results for one Photon request.
  limit: 50
  # Max tiles for one Features request. Large areas are split into tiles.
  max_tiles: 16

t5:
  # T5 candidate generator (plan-005). If the model directory does not exist, the parser uses the patterns only.
  enabled: true
  model_dir: "models/t5/current"
  beams: 4
  # Keep frame groups whose log probability is within this margin of the best frame.
  margin: 2.0
  # Literal split patterns: "always", "fallback" (only if T5 gives no usable frame), or "never".
  use_patterns: fallback
  # If the best frame is "unsupported" with at least this probability, the parser returns Unsupported.
  unsupported_p: 0.5

decisions:
  # Provider for each decision: jev (TypeSafe Jev), local (local cross-encoder), or rules (code and data).
  # A key can be a decision name or a decision with its slot type, for example
  # "fill_closed_slot.category" or "fill_closed_slot.category.group". The most specific key wins.
  # Defaults from the plan-006 evaluation (reports/local-model-report.md).
  providers:
    pick_family: local
    pick_template: local
    pick_split: local
    fill_closed_slot: local
    is_subquery: local
    bind_anchor: rules
    select_source: rules
    disambiguate: rules
  # Local cross-encoder (plan-006).
  local:
    model_dir: "models/local/current"
    device: cpu
  # Minimum confidence for each decision. Below this value the parser returns Unsupported.
  thresholds:
    pick_family: 0.3
    pick_template: 0.3
    fill_closed_slot: 0.3
    bind_anchor: 0.3
    pick_split: 0.2
    is_subquery: 0.2
    select_source: 0.2
    disambiguate: 0.2
  jev:
    url: "https://openrouter.ai/api/alpha/decisions"
    model: "typesafe/jev-1.13"
    timeout_s: 30
  log_dir: "logs"
  max_depth: 2
