family: features
description: "Points of interest of one category (for example hospitals, schools, or banks) inside or near an area, or natural features of one kind (rivers, mountain ranges, lakes, seas) in a place"
templates:
  - id: features_in
    description: "Points of one category inside an area"
    examples: ["hospitals in Koramangala", "schools in coastal districts of Kerala", "Indiranagar cafes"]
    slots:
      category: {type: category, options_ref: categories}
      region: {type: region}
    patterns:
      - "{category} (in|inside|within|of|at|across|located in|throughout) {region}"
      - "{region} {category}"
    dag: "Features(${category}, ${region})"

  - id: features_near
    description: "Points of one category within a distance of an area or near it"
    examples: ["hospitals within 2 km of MG Road", "schools near Indiranagar", "atms 500 m from Brigade Road"]
    slots:
      category: {type: category, options_ref: categories}
      distance: {type: distance, default: policy.default_near_m}
      region: {type: region}
    patterns:
      - "{category} (near|around|close to|nearby|next to|in the vicinity of|near to|surrounding) {region}"
      - "{category} within [a] {distance} [radius] (of|from|around) {region}"
      - "{category} {distance} (from|around|of|near) {region}"
      - "{category} (in|within) [a] {distance} radius (of|from|around) {region}"
      - "{category} (near|around|within|close to) {region} [within] {distance}"
    dag: "Features(${category}, Buffer(${region}, ${distance}))"

  - id: natural_in
    description: "Natural features of one kind (rivers, lakes, mountain ranges, deserts, seas) in or touching a place"
    examples: ["rivers in Karnataka", "mountain ranges of Nepal", "seas that touch India", "lakes in Kenya"]
    slots:
      kind: {type: natural_kind, options_ref: natural_kinds}
      region: {type: region}
    patterns:
      - "{kind} (in|of|within|inside|across|through) {region}"
      - "{kind} (that|which) (flow through|cross|touch|border|are in) {region}"
      - "{region} {kind}"
    dag: "Naturals(${kind}, within=${region})"
