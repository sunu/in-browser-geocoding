family: predicate_filter
description: "The divisions of one level inside a place that have a yes-or-no property (coastal, landlocked, on the international border, on a river, in the mountains), that share a border with another place or are within a distance of it, or the divisions that border a place and have such a property, for example coastal states of a country"
templates:
  - id: children_with_predicate
    description: "Divisions of one level inside a place that have a property such as coastal or landlocked"
    examples: ["coastal states in India", "landlocked districts of Karnataka", "border districts of Punjab"]
    slots:
      pred: {type: predicate, options_ref: predicates}
      level: {type: admin_level, options_ref: admin_levels}
      parent: {type: region, optional: true, default: country}
    patterns:
      - "{head:pred,level}"
      - "{head:pred,level} (in|of|within|inside|across) {parent}"
      - "{head:pred,level} (in|of|within|inside|across) {parent} [that are|which are|that is|which is|that lie|which lie|that have|which have|that has|which has|with|having] {head:pred,level}"
      - "{parent} {head:pred,level}"
    dag: "Filter(Children(${parent}, level=${level}), ${pred})"

  - id: children_touching
    description: "Divisions of one level inside a place that share a border with another place, or with any or all of several places"
    examples: ["districts of Karnataka that border Goa", "districts in Odisha bordering Andhra Pradesh",
               "districts along the Yamuna", "districts of Karnataka that border both Goa and Maharashtra"]
    slots:
      level: {type: admin_level, options_ref: admin_levels}
      parent: {type: region, optional: true, default: country}
      quant: {type: quantifier, options_ref: quantifiers, optional: true, default: any}
      other: {type: region}
    patterns:
      - "{level} (of|in|within) {parent} (that|which) (border|borders|touch|touches|adjoin|adjoins) {quant} {other}"
      - "{level} (of|in|within) {parent} (along|on the banks of|beside) {other}"
      - "{level} (along|on the banks of|beside) {other}"
      - "{level} (of|in|within) {parent} (that|which) (border|borders|touch|touches|adjoin|adjoins) {other}"
      - "{level} (of|in|within) {parent} (bordering|adjoining|adjacent to|next to|touching|sharing a border with|on the border with|on the border of) {other}"
      - "{parent} {level} (bordering|adjoining|adjacent to|next to|touching|that border|that touch) {other}"
    dag: "Filter(Children(${parent}, level=${level}), Touches(${other}, quant=${quant}))"

  - id: children_near
    description: "Divisions of one level within a distance of a place"
    examples: ["districts within 50 km of Goa", "districts of Maharashtra within 30 km of Pune", "states within 100 km of Delhi"]
    slots:
      level: {type: admin_level, options_ref: admin_levels}
      parent: {type: region, optional: true, default: country}
      distance: {type: distance, default: policy.default_near_m}
      other: {type: region}
    patterns:
      - "{level} within {distance} (of|from) {other}"
      - "{level} (of|in) {parent} within {distance} (of|from) {other}"
      - "{level} (near|close to) {other}"
    dag: "Filter(Children(${parent}, level=${level}), Touches(Buffer(${other}, ${distance})))"

  - id: neighbors_with_predicate
    description: "The divisions that border a place and have a property such as coastal or landlocked"
    examples: ["coastal countries that border India", "landlocked states bordering Assam", "coastal districts next to Goa"]
    slots:
      pred: {type: predicate, options_ref: predicates}
      level: {type: admin_level, options_ref: admin_levels, optional: true, default: none}
      of: {type: region}
    patterns:
      - "{head:pred,level} (that|which) (border|borders|touch|touches) {of}"
      - "{head:pred,level} (bordering|adjacent to|next to|touching|neighbouring|neighboring) {of}"
    dag: "Filter(Neighbors(${of}, level=${level}), ${pred})"
