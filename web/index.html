<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>geoparse (browser)</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
  <style>
    :root { --bg: #fafafa; --fg: #1d1d1f; --muted: #6b6b6f; --line: #e3e3e6; --accent: #2563eb; --err: #b42318; --ok: #067647; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161618; --fg: #ececf0; --muted: #9a9aa2; --line: #2c2c31; --accent: #6ea8fe; --err: #f97066; --ok: #47cd89; } }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 16px; margin: 0 12px 0 0; }
    #q { flex: 1 1 320px; padding: 8px 10px; font-size: 15px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); }
    button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: white; font-size: 14px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #status { color: var(--muted); font-size: 13px; width: 100%; }
    body { display: flex; flex-direction: column; height: 100vh; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); flex: 1; min-height: 0; }
    @media (max-width: 800px) { body { height: auto; } main { grid-template-columns: 1fr; } #map { height: 60vh; } }
    #map { min-height: 300px; }
    #side { overflow: auto; padding: 12px 16px; border-left: 1px solid var(--line); }
    .err { color: var(--err); } .ok { color: var(--ok); }
    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    td, th { border-bottom: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: top; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; background: rgba(127,127,127,.08); padding: 8px; border-radius: 6px; }
    #loading { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; background: color-mix(in srgb, var(--bg) 85%, transparent); }
    #loading[hidden] { display: none; }
    #loading .card { width: min(460px, 100%); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 20px; box-shadow: 0 8px 30px rgba(0,0,0,.12); }
    #loading h2 { margin: 0 0 6px; font-size: 17px; }
    #loading p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
    .step { display: grid; grid-template-columns: 18px 1fr auto; gap: 4px 8px; align-items: center; margin: 10px 0; font-size: 13px; }
    .step .mark { color: var(--muted); } .step.done .mark { color: var(--ok); }
    .step .size { color: var(--muted); font-variant-numeric: tabular-nums; }
    .step .bar { grid-column: 2 / 4; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
    .step .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    .step.done .bar i { background: var(--ok); }
    #loading .now { min-height: 1.4em; margin: 12px 0 0; font-size: 12px; color: var(--muted); word-break: break-all; }
    #loading .err { margin-top: 12px; }
    .muted { color: var(--muted); }
    #side h4 { margin: 18px 0 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1px solid var(--line); border-radius: 12px; padding: 2px 10px; font-size: 13px; }
    .chip b { color: var(--muted); font-weight: 500; margin-right: 4px; }
    .dec { border-left: 3px solid var(--line); padding: 4px 0 4px 10px; margin: 8px 0; }
    .dec .q { font-weight: 600; }
    .dec .a { margin: 2px 0; }
    .dec .meta { display: flex; gap: 8px; align-items: center; font-size: 12px; }
    .dec details { font-size: 12px; } .dec ul { margin: 4px 0; padding-left: 18px; }
    .tag { background: rgba(127,127,127,.12); border-radius: 4px; padding: 0 6px; }
    .conf { display: inline-block; width: 60px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .conf i { display: block; height: 100%; background: var(--ok); } .conf.err i { background: var(--err); }
    details.how { margin: 10px 0; font-size: 13px; } details.how p { margin: 6px 0; }
    code { font-size: 12px; }
    .examples { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; }
    .examples .group { display: inline-flex; flex-wrap: wrap; align-items: baseline; }
    .examples button { background: transparent; color: var(--accent); padding: 2px 6px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>geoparse</h1>
    <input id="q" placeholder="for example: coastal states of Mexico" autocomplete="off" />
    <button id="go" disabled>Run</button>
    <div id="status">Loading…</div>
    <div class="examples" id="examples"></div>
  </header>
  <div id="loading">
    <div class="card" role="status" aria-live="polite">
      <h2>Loading the geocoder</h2>
      <p>The geocoder runs fully in this browser tab. It downloads its two language models and the place data one time.
        The browser keeps the files for your next visit.</p>
      <div id="steps"></div>
      <div class="now" id="now"></div>
    </div>
  </div>
  <main>
    <div id="map"></div>
    <div id="side"></div>
  </main>
  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
