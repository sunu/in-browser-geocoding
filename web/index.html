<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>geoparse (browser)</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
  <style>
    :root { --bg: #fafafa; --fg: #1d1d1f; --muted: #6b6b6f; --line: #e3e3e6; --accent: #2563eb; --err: #b42318; --ok: #067647; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161618; --fg: #ececf0; --muted: #9a9aa2; --line: #2c2c31; --accent: #6ea8fe; --err: #f97066; --ok: #47cd89; } }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 16px; margin: 0 12px 0 0; }
    #q { flex: 1 1 320px; padding: 8px 10px; font-size: 15px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); }
    button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: white; font-size: 14px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #status { color: var(--muted); font-size: 13px; width: 100%; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: calc(100vh - 92px); }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } #map { height: 60vh; } }
    #map { min-height: 300px; }
    #side { overflow: auto; padding: 12px 16px; border-left: 1px solid var(--line); }
    .err { color: var(--err); } .ok { color: var(--ok); }
    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    td, th { border-bottom: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: top; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; background: rgba(127,127,127,.08); padding: 8px; border-radius: 6px; }
    .examples button { background: transparent; color: var(--accent); padding: 2px 6px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>geoparse</h1>
    <input id="q" placeholder="districts near the sea in Gujarat" autocomplete="off" />
    <button id="go" disabled>Run</button>
    <div id="status">Loading…</div>
    <div class="examples" id="examples"></div>
  </header>
  <main>
    <div id="map"></div>
    <div id="side"></div>
  </main>
  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
