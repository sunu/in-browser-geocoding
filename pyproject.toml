[project]
name = "geoparse"
version = "0.1.0"
description = "Convert a natural-language location query into a geometry or a set of entities."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "shapely>=2.0",
    "pyproj>=3.6",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ner = ["onnxruntime>=1.18", "tokenizers>=0.19", "huggingface-hub>=0.23", "numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geoparse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
